[flake8]
ignore = E402, E721, W504
max_line_length = 120
exclude =
    .git,
    __pycache__,
    docs,
    old,
    build,
    dist,
    .eggs,
    *.egg,
    nndet/conf,
    *__init__.py,
    projects,
    tests

[tool:pytest]
addopts = --cov=nndet --cov-report=xml --cov-report term

[coverage:run]
source = nndet
omit =
    *__init__.py
    *registry.py
    tests/*
