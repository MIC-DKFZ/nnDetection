[flake8]
ignore = E402, E721, W504
max_line_length = 120
exclude =
    .git,
    __pycache__,
    docs,
    old,
    build,
    dist,
    .eggs,
    *.egg,
    nndet/conf,
    *__init__.py,
    projects,
    tests

[tool:black]
line-length = 120
exclude = "(.eggs|.git|.hg|.mypy_cache|.venv|_build|buck-out|build|dist)"

[tool:isort]
profile = black
# line_length = 120

[coverage:run]
source = nndet
omit =
    *__init__.py
    *registry.py
    tests/*

