[tox:tox]
minversion = 3.24.0
envlist = py{38}
isolated_build = True

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    torch>=1.7.0
    torchvision>=0.8.0
    .[dev]
commands = pytest

[flake8]
ignore = 
    # see: https://www.flake8rules.com/
    W503
    W504
    E203
    E402
    E262

max_line_length = 120
# https://pep8.readthedocs.io/en/latest/intro.html#error-codes
select = E,W,F
verbose = 2
format = pylint
doctests = True
exclude =
    .git,
    __pycache__,
    docs,
    old,
    build,
    dist,
    .eggs,
    *.egg,
    nndet/conf,
    *__init__.py,
    projects,
    tests,
    .tox,
    setup.py

[coverage:run]
source = nndet
omit =
    *__init__.py
    *registry.py
    tests/*

