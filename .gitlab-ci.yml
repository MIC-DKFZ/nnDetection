default:
  image: nvcr.io/nvidia/pytorch:22.01-py3

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

stages:
  - format
  - test
  - deploy

format-job:
  stage: format
  script:
    - echo "Check Versions"
    - python --version
    - python -c "import torch"
    - pip --version
    - echo "Install"
    - pip install pre-commit
    - pip install git+https://github.com/mibaumgartner/reuse-tool.git
    - echo "Check Install"
    - pre-commit --version
    - pre-commit install
    - echo "Run pre-commit hooks"
    - pre-commit run --all-files --show-diff-on-failure
    - reuse --root nndet lint

pytest-job:
  stage: test
  script:
    - echo "Check Versions"
    - python --version
    - python -c "import torch; print(torch.__version__)"
    - pip --version
    - pip uninstall torchtext -y
    - echo "Install Package"
    - pip install .[dev]
    - echo "Print Dep Tree"
    - pip install pipdeptree
    - pipdeptree
    - pipdeptree --reverse --packages torch
    - pipdeptree --reverse --packages torchvision
    - pipdeptree --reverse --packages numpy
    - echo "Run Tests"
    - coverage run -m pytest -vrs
    - coverage report
    - coverage xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml 
  coverage: '/TOTAL.*\s+(\d+\%)/'

pages:
  stage: deploy
  script:
    - echo "Check Versions"
    - python --version
    - python -c "import torch"
    - pip --version
    - pip uninstall torchtext -y
    - echo "Install Package"
    - pip install .[dev]
    - echo "Building Docs"
    - mkdir public
    - cd docs && make html
    - cp -r ./build/html/* ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


