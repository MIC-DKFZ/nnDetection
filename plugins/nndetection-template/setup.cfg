[flake8]
ignore = 
    # see: https://www.flake8rules.com/
    W503
    W504
    E203
    E402
    E262

max_line_length = 120
# https://pep8.readthedocs.io/en/latest/intro.html#error-codes
select = E,W,F
verbose = 2
format = pylint
doctests = True
exclude =
    .git,
    __pycache__,
    docs,
    old,
    build,
    dist,
    .eggs,
    *.egg,
    nndet/conf,
    *__init__.py,
    projects,
    tests,
    .tox

[tool:black]
line-length = 120
exclude = "(.eggs|.git|.hg|.mypy_cache|.venv|_build|buck-out|build|dist)"

[coverage:run]
source = XXX # FIXME
omit =
    *__init__.py
    *registry.py
    tests/*
