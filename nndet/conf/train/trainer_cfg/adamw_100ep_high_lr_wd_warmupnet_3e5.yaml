# AdamW Optimizer with Poly Learn rate

save_top_k: 1 # topk model selection [optonal; Default 1]
sweep_key: mAP_IoU_0.10_0.50_0.05
monitor_key: val/box_${trainer_cfg.sweep_key} # used to determine the best model
monitor_mode: "max" # metric operation mode "min" or "max"

max_num_epochs: 106 # max number of epochs
num_train_batches_per_epoch: 2500 # number of train batches per epoch
num_val_batches_per_epoch: 100 # number of val batches per epoch
num_warmup_epochs: 6

opt_class_1: "AdamWLWPoly_warmup"
opt_class_2: "AdamWLWPoly_finetuning"
initial_lr_warmup: 3.e-5
initial_lr_finetuning: 3.e-5 # initial learning rate to start with
weight_decay: 1.e-4 # weight decay for optimizer

# AdamW specific parameters
beta1: 0.9
beta2: 0.999
eps: 1e-4
amsgrad: True # PyTorch Default False

iterations_warmup: 15000 # number of iterations with warmup
warm_iterations_finetuning: 0
warm_lr: 1.e-6 # learning rate to start warmup from 1.e-6
warm_lr_finetuning: 1.e-6

poly_gamma: 0.9 # poly learning rate gamma

swa_epochs: 0 # number of epochs to run swa with cyclic learning rate
# sweep_ckpt: Select checkpoint identifier for sweeping. Default "last".