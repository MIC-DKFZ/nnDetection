save_top_k: 1 # topk model selection [optonal; Default 1]
sweep_key: mAP_IoU_0.10_0.50_0.05
monitor_key: val/box_${trainer_cfg.sweep_key} # used to determine the best model
monitor_mode: "max" # metric operation mode "min" or "max"

max_num_epochs: 53 # max number of epochs
num_train_batches_per_epoch: 2500 # number of train batches per epoch 2500
num_val_batches_per_epoch: 100 # number of val batches per epoch 100
num_warmup_epochs: 3


opt_class_1: "SGDLWPoly_warmup"
opt_class_2: "SGDLWPoly_finetuning"
initial_lr_warmup: 0.01
initial_lr_finetuning: 0.01 # initial learning rate to start with
weight_decay: 3.e-5 # weight decay for optimizer

# SGD specific parameters
sgd_momentum: 0.9 # momentum term
sgd_nesterov: True # nesterov momentum

iterations_warmup: 7500 # number of iterations with warmup
warm_iterations_finetuning: 4000
warm_lr: 1.e-6 # learning rate to start warmup from 1.e-6
warm_lr_finetuning: 1.e-6

poly_gamma: 0.9 # poly learning rate gamma

swa_epochs: 0 # number of epochs to run swa with cyclic learning rate
# sweep_ckpt: Select checkpoint identifier for sweeping. Default "last".


