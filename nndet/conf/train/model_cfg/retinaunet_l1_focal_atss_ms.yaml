backbone_kwargs: {} # keyword arguments passed to encoder
neck_kwargs: # keyword arguments passed to decoder
  min_out_channels: 8
  upsampling_mode: "transpose"

  num_lateral: 1
  norm_lateral: False
  activation_lateral: False

  num_out: 1
  norm_out: False
  activation_out: False

head_kwargs: {} # keyword arguments to passed to head

head_classifier_kwargs: # keyword arguments passed to classifier in head
  num_convs: 1
  norm_channels_per_group: 16
  norm_affine: True
  reduction: "mean_last_sum"
  gamma: 1.
  alpha: 0.75
  loss_weight: 0.3
  prior_prob: 0.01
  loss_fp32: True # requried for focal loss, jit won't work otherwise

head_regressor_kwargs: # keyword arguments passed to regressor in head
  num_convs: 1
  norm_channels_per_group: 16
  norm_affine: True
  reduction: "sum"
  loss_weight: 1.
  learn_scale: True

segmenter_kwargs:
  dice_kwargs:
    batch_dice: True
    smooth_nom: 0.

matcher_kwargs: # keyword arguments passed to matcher
  num_candidates: 4
  center_in_gt: False

plan_arch_overwrites: {} # overwrite arguments of architecture
plan_anchors_overwrites: {} # overwrite arguments of anchors

