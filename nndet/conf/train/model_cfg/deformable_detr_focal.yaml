# DETR
# detection parameters
detection_per_img: 24  # number of detections per image
two_stage: True

# global parameters
hidden_dim: 256 # feature length of the transformer input (must be divisible by the number of attention heads)
num_feature_levels: 1

# backbone
backbone_kwargs: # keyword arguments passed to encoder
  pooling_mode: conv_kernel # one of 'conv_stride' | 'max_kernel' | 'max_stride | 'avg_kernel' | 'avg_stride'
  start_channels: 32 # number of starting channels
  max_channels: 384 # maximum number of channels

# Channel Mapper
channel_mapper_kwargs:
  num_feature_levels: ${model_cfg.num_feature_levels}
  extra_levels: 0
  kernel_size: 1
  conv_kwargs:
    norm_channels_per_group: 16
    add_act: False

# Transformer Encoder
transformer_encoder_kwargs:
  num_layers: 3
  post_norm: False
  attn_dropout: 0.1
  proj_dropout: 0.1
  ffn_dropout: 0.1
  dim_feedforward: 1024
  hidden_dim: ${model_cfg.hidden_dim} # feature length of the transformer input (must be divisible by the number of attention heads)
  attention_heads: 8  # number of attention heads in the transformer
  num_points: 4 # number of pixels attended to by deformable attention

transformer_decoder_kwargs:
  num_layers: 3
  post_norm: True
  attn_dropout: 0.1
  proj_dropout: 0.1
  ffn_dropout: 0.1
  dim_feedforward: 1024
  hidden_dim: ${model_cfg.hidden_dim} # feature length of the transformer input (must be divisible by the number of attention heads)
  attention_heads: 8  # number of attention heads in the transformer

# positional embedding keyword arguments
pos_embed:
  # sine embedding
  temperature: 10000
  normalize: True  # old default was False
  scale:
  offset: 0.0

# head
head_kwargs:
  aux_loss: True
  scale_aux_loss: 'none' # one of 'none' | 'mean' | 'reduced'
  norm_cls_loss_by_num_boxes: True # normalize classification loss by avg number of boxes
  norm_reg_loss_by_num_boxes: True # normalize regression loss by avg number of boxes

# classifier
head_classifier_kwargs:
  internal_channels: ${model_cfg.hidden_dim}
  num_layers: 2
  add_norm: False
  dropout_rate: 0.0
  num_decoder_layers: ${model_cfg.transformer_decoder_kwargs.num_layers}
  share_mlp: False
  use_encoder_mlp: ${model_cfg.two_stage}
  class_agnostic_aux: False
  # loss
  gamma: 1 # gamma for focal loss
  alpha: 0.75  # alpha for focal loss
  loss_weight: 2 # cls loss weight
  reduction: "mean_last_sum"  # set to 'sum' if norm_cls_loss_by_num_boxes is True, otherwise 'mean'

# regressor
head_regressor_kwargs:
  internal_channels: ${model_cfg.hidden_dim}
  num_layers: 2
  add_norm: False
  dropout_rate: 0.0
  num_decoder_layers: ${model_cfg.transformer_decoder_kwargs.num_layers}
  share_mlp: False
  use_encoder_mlp: ${model_cfg.two_stage}
  # loss
  loss_weight: 5 # loss weight L1
  box_loss_weight: 2 # loss weight GIoU
  reduction: "sum"  # set to 'sum' if norm_reg_loss_by_num_boxes is True, otherwise 'mean'

# postprocessing
head_box_post_kwargs:
  topk: ${model_cfg.detection_per_img}

# matcher
matcher_class_criterion_kwargs:
  loss_weight: 2
  gamma: ${model_cfg.head_classifier_kwargs.gamma}
  alpha: ${model_cfg.head_classifier_kwargs.alpha}
matcher_reg_criterion_kwargs:
  loss_weight: 5
matcher_box_criterion_kwargs:
  loss_weight: 2
matcher_kwargs: {}

# optional
neck_kwargs: # keyword arguments passed to decoder
  min_out_channels: 8
  upsampling_mode: "transpose"

  num_lateral: 1
  norm_lateral: False
  activation_lateral: False

  num_out: 1
  norm_out: False
  activation_out: False
