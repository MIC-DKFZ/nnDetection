# DETR
# detection parameters
detection_per_img: 24  # number of detections per image

# backbone
backbone_kwargs: # keyword arguments passed to encoder
  pooling_mode: conv_kernel # one of 'block' | 'conv_stride' | 'max_kernel' | 'max_stride | 'avg_kernel' | 'avg_stride'
  start_channels: 48 # number of starting channels
  max_channels: 512 # maximum number of channels

# Channel Mapper
channel_mapper_kwargs: {}
num_feature_levels: 1
num_total_levels: 1

# transformer
transformer_kwargs: {} # Transformer kwargs
num_encoder_layers: 3
encoder_post_norm: False
num_decoder_layers: 3
decoder_post_norm: True
transformer_attn_dropout: 0.1
transformer_proj_dropout: 0.1
transformer_ffn_dropout: 0.1
dim_feedforward: 1024
hidden_dim: 384 # feature length of the transformer input (must be divisible by the number of attention heads)
query_dim: 384 # should be the same as hidden_dim except for DABDETR
attention_heads: 8  # number of attention heads in the transformer



# positional embedding keyword arguments
pos_embed:
  # sine embedding
  temperature: 10000
  normalize: True  # old default was False
  scale:
  offset: 0.0

# head
head_kwargs:
  aux_loss: True
  scale_aux_loss: 'none' # one of 'none' | 'mean' | 'reduced'
  norm_cls_loss_by_num_boxes: False # normalize classification loss by avg number of boxes
  norm_reg_loss_by_num_boxes: True # normalize regression loss by avg number of boxes

# classifier
head_classifier_kwargs:
  internal_channels: ${model_cfg.hidden_dim}
  num_layers: 1
  add_norm: False
  dropout_rate: 0.0
  # loss
  background_weight: 0.1 # background cross entropy weight
  loss_weight: 2 # cls loss weight
  reduction: "mean"  # set to 'sum' if norm_cls_loss_by_num_boxes is True, otherwise 'mean'

# regressor
head_regressor_kwargs:
  internal_channels: ${model_cfg.hidden_dim}
  num_layers: 3
  add_norm: False
  dropout_rate: 0.0
  # loss
  loss_weight: 5 # loss weight L1
  box_loss_weight: 2 # loss weight GIoU
  reduction: "sum"  # set to 'sum' if norm_reg_loss_by_num_boxes is True, otherwise 'mean'

# postprocessing
head_box_post_kwargs: {}

# matcher
matcher_class_criterion_kwargs:
  loss_weight: 2
matcher_reg_criterion_kwargs:
  loss_weight: 5
matcher_box_criterion_kwargs:
  loss_weight: 2
matcher_kwargs: {}

# optional
neck_kwargs: # keyword arguments passed to decoder
  min_out_channels: 8
  upsampling_mode: "transpose"

  num_lateral: 1
  norm_lateral: False
  activation_lateral: False

  num_out: 1
  norm_out: False
  activation_out: False
