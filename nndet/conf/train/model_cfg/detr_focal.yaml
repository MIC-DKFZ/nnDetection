# DETR
# backbone
backbone_kwargs: # keyword arguments passed to encoder
  max_channels: 384
  # num_conv: [4, 4, 8, 8] # 1 res full res, 2 lower res, 4 det res
  # num_conv_stem: 2 # 1 conv init
  # start_channels: 32

# transformer
transformer_kwargs: {} # Transformer kwargs: needed
num_encoder_layers: 3
num_decoder_layers: 3
dim_feedforward: 1024
hidden_dim: 192 # feature length of the transformer input (must be divisible by the number of attention heads)
query_dim: 192 # should be the same as hidden_dim except for DABDETR
attention_heads: 8  # number of attention heads in the transformer

# positional embedding keyword arguments
pos_embed:
  # sine embedding
  temperature: 10000
  normalize: True  # old default was False
  scale:
  offset: 0.0

# head
head_kwargs:
  aux_loss: True
  scale_aux_loss: 'none' # one of 'none' | 'mean' | 'reduced'
  norm_cls_loss_by_num_boxes: True # normalize classification loss by avg number of boxes
  norm_reg_loss_by_num_boxes: True # normalize regression loss by avg number of boxes

# classifier
head_classifier_kwargs:
  internal_channels: ${model_cfg.hidden_dim}
  num_layers: 2
  add_norm: False
  dropout_rate: 0.0
  # loss
  gamma: 1 # background cross entropy weight
  loss_weight: 2 # cls loss weight
  reduction: "mean_d1_sum"  # set to 'sum' if norm_cls_loss_by_num_boxes is True, otherwise 'mean'

# regressor
head_regressor_kwargs:
  internal_channels: ${model_cfg.hidden_dim}
  num_layers: 2
  add_norm: False
  dropout_rate: 0.0
  # loss
  loss_weight: 5 # loss weight L1
  box_loss_weight: 2 # loss weight GIoU
  reduction: "sum"  # set to 'sum' if norm_reg_loss_by_num_boxes is True, otherwise 'mean'

# matcher
matcher_class_criterion_kwargs:
  loss_weight: 2
matcher_reg_criterion_kwargs:
  loss_weight: 5
matcher_box_criterion_kwargs:
  loss_weight: 2
matcher_kwargs: {}

# detection parameters
detection_per_img: 6  # number of detections per image

# optional
neck_kwargs: # keyword arguments passed to decoder
  min_out_channels: 8
  upsampling_mode: "transpose"

  num_lateral: 1
  norm_lateral: False
  activation_lateral: False

  num_out: 1
  norm_out: False
  activation_out: False
