# DETR
# detector settings
detector:
  min_detection_per_img: 12 # minimum number of detections per image

# backbone
backbone_kwargs: # keyword arguments passed to encoder
  num_conv_stem: 2
  num_conv: [4, 4, 6]
  max_channels: 384
  pooling_mode: "conv_kernel"

# Channel Mapper
channel_mapper_kwargs:
  extra_levels: 0
  kernel_size: 1
  conv_kwargs:
    num_groups: 16
    bias: True
    add_act: False

# transformer
transformer: # general configutation of transformer module
  hidden_dim: 128 # feature length of the transformer input (must be divisible by the number of attention heads)
  num_points: 4 # number of pixels attended to by deformable attention
  two_stage: True  # perform two stage detection (deformable detr only)
  use_pos_queries: False # double number of query channels which will later be splitted into content and positional
  num_feature_levels: 4  # number fo feature levels to use for deformable attention
  transformer_kwargs: # keyword arguments passed to transformer class
    two_stage_base_object_scale: 0.05 # base object scale for two-stage deformable DETR (two stage only)
    pos_embed_temperature: 10000 # temperature for positional embedding of proposals (two stage only)
    enc_class_agnostic_loss: ${model_cfg.head_kwargs.enc_class_agnostic_loss} # use binary labels to compute encoder loss (two stage only)

# Transformer Encoder
transformer_encoder_kwargs:
  num_layers: 3
  post_norm: False
  attn_dropout: 0.0
  proj_dropout: 0.0
  ffn_dropout: 0.0
  dim_feedforward: 1024 # medium influence on memory (~ 1GB between 1024 & 512)
  hidden_dim: ${model_cfg.transformer.hidden_dim} # feature length of the transformer input (must be divisible by the number of attention heads)
  attention_heads: 8  # number of attention heads in the transformer
  num_points: ${model_cfg.transformer.num_points} # number of pixels attended to by deformable attention

transformer_decoder_kwargs:
  num_layers: 6 # smallish influence on memory (200-300mb between 3 & 6)
  attn_dropout: 0.0
  proj_dropout: 0.0
  ffn_dropout: 0.0
  dim_feedforward: 1024 # medium influence on memory (~ 1GB between 1024 & 512)
  hidden_dim: ${model_cfg.transformer.hidden_dim} # feature length of the transformer input (must be divisible by the number of attention heads)
  attention_heads: 8  # number of attention heads in the transformer
  num_points: ${model_cfg.transformer.num_points} # number of pixels attended to by deformable attention

# positional embedding keyword arguments
pos_embed:
  # sine embedding
  temperature: 10000
  normalize: True  # old default was False
  scale:
  offset: 0.0

# head
head_kwargs:
  aux_loss: True
  scale_aux_loss: 'none' # one of 'none' | 'mean' | 'reduced'
  norm_cls_loss_by_num_boxes: True # normalize classification loss by avg number of boxes
  norm_reg_loss_by_num_boxes: True # normalize regression loss by avg number of boxes
  enc_class_agnostic_loss: False # default Deformable DETR: True; compute enc class loss on binary labels

# classifier
head_classifier_kwargs:
  internal_channels: ${model_cfg.transformer.hidden_dim}
  num_layers: 1
  add_norm: False
  dropout_rate: 0.0
  num_decoder_layers: ${model_cfg.transformer_decoder_kwargs.num_layers}
  share_mlp: False
  use_encoder_mlp: ${model_cfg.transformer.two_stage}
  class_agnostic_aux: False
  prior_prob: 0.05
  # loss
  gamma: 1 # gamma for focal loss
  alpha: 0.75  # alpha for focal loss
  loss_weight: 1 # cls loss weight
  reduction: "mean_last_sum"  # set to 'sum' if norm_cls_loss_by_num_boxes is True, otherwise 'mean'
  loss_fp32: True

# regressor
head_regressor_kwargs:
  internal_channels: ${model_cfg.transformer.hidden_dim}
  num_layers: 3
  add_norm: False
  dropout_rate: 0.0
  num_decoder_layers: ${model_cfg.transformer_decoder_kwargs.num_layers}
  share_mlp: False
  use_encoder_mlp: ${model_cfg.transformer.two_stage}
  ffn_weight_init: "none" # one of none | zero_bias | zero
  # loss
  loss_weight: 5 # loss weight L1
  box_loss_weight: 2 # loss weight GIoU
  reduction: "sum"  # set to 'sum' if norm_reg_loss_by_num_boxes is True, otherwise 'mean'
  loss_fp32: True
  box_loss_fp32: True

# matcher
matcher_class_criterion_kwargs:
  loss_weight: 2
  gamma: ${model_cfg.head_classifier_kwargs.gamma}
  alpha: ${model_cfg.head_classifier_kwargs.alpha}
matcher_reg_criterion_kwargs:
  loss_weight: 5
matcher_box_criterion_kwargs:
  loss_weight: 2
matcher_kwargs: {}

# postprocessing
head_box_post_kwargs: {}
